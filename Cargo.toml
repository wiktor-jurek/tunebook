[workspace]
resolver = "3"
members = ["crates/listen-core", "crates/notation-core", "crates/listen-ffi", "crates/listen-wasm", "services/realtime"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.88"

[workspace.dependencies]
listen-core = { path = "crates/listen-core" }
notation-core = { path = "crates/notation-core" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
