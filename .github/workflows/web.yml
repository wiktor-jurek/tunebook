name: Web

on:
  pull_request:
    paths: ["apps/web/**", "packages/tokens/**", "package.json", "package-lock.json", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["apps/web/**", "packages/tokens/**", "package.json", "package-lock.json"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
