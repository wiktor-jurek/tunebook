name: Android

on:
  pull_request:
    paths: ["apps/android/**", "crates/listen-core/**", "crates/listen-ffi/**", "Cargo.lock", "justfile", ".github/workflows/android.yml", ".github/actions/android-setup/**"]
  push:
    branches: [main]
    paths: ["apps/android/**", "crates/listen-core/**", "crates/listen-ffi/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-setup
      - run: ./gradlew assembleDebug
        working-directory: apps/android
