name: Android

on:
  pull_request:
    paths: ["apps/android/**", "crates/listen-core/**", "crates/listen-ffi/**", "Cargo.lock", "justfile", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["apps/android/**", "crates/listen-core/**", "crates/listen-ffi/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - name: Build the listen engine
        run: |
          cargo build --release -p listen-ffi
          cargo ndk -t arm64-v8a -t x86_64 -o apps/android/core/listen/src/main/jniLibs build --release -p listen-ffi --lib
          cargo run --release -p listen-ffi --bin uniffi-bindgen -- generate --library target/release/liblisten_ffi.so --language kotlin --no-format --out-dir apps/android/core/listen/src/main/java
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
        working-directory: apps/android
