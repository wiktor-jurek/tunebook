name: Android setup
description: JDK, Android SDK and NDK, Rust, and the listen engine's jniLibs and UniFFI Kotlin bindings (both gitignored).

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
    # The default package list includes "tools", which the current SDK no longer has, and fails the step.
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - shell: bash
      run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android, x86_64-linux-android
    - uses: Swatinem/rust-cache@v2
    - shell: bash
      run: cargo install cargo-ndk --locked
    - name: Build the listen engine
      shell: bash
      # The release profile strips symbols, and on Linux that takes the UniFFI metadata the bindgen reads out of the
      # host library with it, so the host build (for bindings only) keeps them. The .so files that ship stay stripped.
      run: |
        cargo ndk -t arm64-v8a -t x86_64 -o apps/android/core/listen/src/main/jniLibs build --release -p listen-ffi --lib
        export CARGO_PROFILE_RELEASE_STRIP=false
        cargo build --release -p listen-ffi
        cargo run --release -p listen-ffi --bin uniffi-bindgen -- generate --library target/release/liblisten_ffi.so --language kotlin --no-format --out-dir apps/android/core/listen/src/main/java
    - uses: gradle/actions/setup-gradle@v4
