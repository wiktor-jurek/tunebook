# CLEWS fine-tuned on rendered session performances of The Session catalog.
# Model, CQT and loss match sony/clews config/dvi-clews.yaml so its DiscogsVI weights load.
jobname: null
seed: 43
checkpoint: null
limit_batches: null
init_weights: null        # DiscogsVI checkpoint to start from (weights only)

path:
  cache: "cache/"
  logs: "logs/"
  audio: null
  meta: null

fabric:
  nnodes: 1
  ngpus: 1
  precision: "bf16-mixed"

data:
  nworkers: 30
  samplerate: 16000
  audiolen: 30            # seconds per rendered performance
  maxlen: null
  pad_mode: "repeat"
  n_per_class: 4
  p_samesong: 0
  epoch_size: 20000
  valid_tunes: 500
  valid_versions: 3
  backing: 0.6            # share of performances with guitar, bouzouki or piano
  yue: ["data/yue/train/vast", "data/yue/train/vast3", "data/yue/train/vast4"]              # YuE2 clips (yue/batch.py output), relative to ml/
  found: "data/found/manifest.jsonl"     # found songs (python -m found export)
  p_recorded_tune: 0.5    # share of items drawn from tunes that have recorded clips
  p_recorded_version: 0.5 # within those, share of the extra versions that are recordings

augmentations:
  specaugment:
    p: 0.2
    n: 1
    full: true
    f_pc: 0.15
    t_pc: 0.15
  timestretch:
    p: 0.2
    r: [0.8, 1.25]
    pad_mode: "repeat"
    cut_mode: "random"
  pitchtranspose:
    p: 0.2
    r: [-6, 6]

model:
  name: "tunebook_clews"
  shingling:
    len: 10               # queries are 5–15 s clips
    hop: 10
  cqt:
    hoplen: 0.02
    noctaves: 7
    nbinsoct: 12
    fscale: 1
    pool: 5
  frontend:
    cqtpow: 0.5
    channels: [128, 256]
  backbone:
    blocks: [3, 4, 6, 3]
    channels: [256, 512, 1024, 2048]
    down: [1, 2, 2, 1]
  zdim: 1024
  loss:
    redux:
      pos: "bpwr-5"
      neg: "min"
    gamma: 5
    epsilon: 1e-6

training:
  batchsize: 24
  numepochs: 60
  save_freq: null
  optim:
    name: "adam"
    lr: 5e-5              # fine-tuning: well below the 2e-4 used from scratch
    wd: 0
    sched: "plateau_5"
    min_lr: 1e-6
  monitor:
    quantity: "m_COMP"
    mode: "min"
