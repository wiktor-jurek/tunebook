[project]
name = "tunebook-ml"
version = "0.1.0"
description = "Training, rendering and evaluation for Tunebook Listen"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0",
  "soundfile>=0.12",
  "requests>=2.32",
  "scipy>=1.17.1",
  "pyfluidsynth>=1.4.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]
# Matches sony/clews: nnAudio 0.3.3 gives the CQT the published checkpoints were trained with.
train = [
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "torchvision==0.24.1",
  "soxr>=0.3.7",
  "nnAudio==0.3.3",
  "einops>=0.8",
  "omegaconf>=2.3",
  "lightning>=2.3",
  "torchinfo>=1.8",
  "tqdm>=4.66",
  "tensorboard>=2.17",
  "julius>=0.2.7",
]

[tool.uv]
package = false

# CUDA 12.8 builds on Linux: they run on drivers from 570 (mantis) as well as on Vast.ai boxes.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
