[package]
name = "listen-ffi"
version = "0.1.0"
description = "UniFFI bindings to listen-core and notation-core for the iOS (Swift) and Android (Kotlin) apps"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
# staticlib for the iOS XCFramework, cdylib for Android's jniLibs, lib for the bindgen binary.
crate-type = ["lib", "staticlib", "cdylib"]
name = "listen_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
listen-core.workspace = true
notation-core.workspace = true
uniffi = { version = "0.32", features = ["cli"] }
